spring.application.name=sdmxdw

# separate test database (dropped and re-created by the tests); override via SDMXDW_TEST_DB_*
spring.datasource.url=${SDMXDW_TEST_DB_URL:jdbc:postgresql://localhost:5432/sdmxdw_test}
spring.datasource.username=${SDMXDW_TEST_DB_USER:sdmxdw}
spring.datasource.password=${SDMXDW_TEST_DB_PASSWORD:sdmxdw}

spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.clean-disabled=false

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

management.health.mail.enabled=false

sdmxdw.plugins.python-executable=${SDMXDW_PYTHON:python3}

sdmxdw.processes.dir=target/test-processes
sdmxdw.processes.runs-dir=target/test-runs
sdmxdw.processes.secret-key-file=target/test-secret.key
sdmxdw.processes.git-dir=target/test-git
sdmxdw.processes.python-executable=${sdmxdw.plugins.python-executable}
sdmxdw.processes.r-executable=${SDMXDW_RSCRIPT:Rscript}
sdmxdw.processes.r-libs=${SDMXDW_R_LIBS:}
sdmxdw.processes.api-url=http://localhost:${local.server.port:8080}/rest
# the test database has no legacy jobs; no legacy scripts either
sdmxdw.plugins.scripts-dir=

spring.mail.host=${SDMXDW_SMTP_HOST:localhost}
spring.mail.port=${SDMXDW_SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# a fixed bootstrap password for the test database
sdmxdw.bootstrap.admin-password=test-admin-password
