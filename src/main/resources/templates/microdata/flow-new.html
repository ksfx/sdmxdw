<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="sdmxdw">
<head>
    <meta charset="UTF-8"/>
    <title>New microdata flow</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/css/brand.css" />
    <link rel="icon" href="/img/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="p-8">
    <div class="card bg-base-100 shadow-xl p-6 max-w-lg">
        <h1 class="text-xl font-bold mb-4">New microdata flow</h1>
        <form method="post" th:action="@{/microdata}" class="space-y-2">
            <input class="input input-bordered w-full" name="agencyId" placeholder="Agency Id (e.g. SNB)" required/>
            <input class="input input-bordered w-full" name="artefactId" placeholder="Artefact Id (e.g. MDF_EKE)" required/>
            <input class="input input-bordered w-full" name="version" placeholder="Version" required/>
            <input class="input input-bordered w-full" name="name" placeholder="Name" required/>
            <textarea class="textarea textarea-bordered w-full" name="description" placeholder="Description (optional)"></textarea>
            <button class="btn btn-primary" type="submit">Create</button>
        </form>
    </div>
</div>
</body>
</html>
