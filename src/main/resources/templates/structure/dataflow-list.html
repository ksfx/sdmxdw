<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="sdmxdw">
<head>
    <meta charset="UTF-8"/>
    <title>Dataflows</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/css/brand.css" />
    <link rel="icon" href="/img/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="p-8 space-y-6">
    <div class="card bg-base-100 shadow-xl p-6">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold">Dataflows</h1>
            <a class="btn btn-primary btn-sm" th:href="@{/structures/dataflows/new}">New dataflow</a>
        </div>
        <table class="table">
            <thead>
            <tr><th>Agency</th><th>Id</th><th>Version</th><th>Name</th></tr>
            </thead>
            <tbody>
            <tr th:each="df : ${dataflows}">
                <td th:text="${df.agencyId}"></td>
                <td><a class="link link-primary" th:href="@{/structures/dataflows/{id}(id=${df.id})}" th:text="${df.artefactId}"></a></td>
                <td th:text="${df.version}"></td>
                <td th:text="${df.name}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
