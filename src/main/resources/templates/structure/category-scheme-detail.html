<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="sdmxdw">
<head>
    <meta charset="UTF-8"/>
    <title>Category Scheme</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/css/brand.css" />
    <link rel="icon" href="/img/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="p-8 space-y-6">
    <div class="card bg-base-100 shadow-xl p-6">
        <h1 class="text-xl font-bold" th:text="${scheme.agencyId} + ':' + ${scheme.artefactId} + '(' + ${scheme.version} + ')'"></h1>
        <p class="text-lg" th:text="${scheme.name}"></p>
        <table class="table mt-4">
            <thead><tr><th>Code</th><th>Name</th><th>Parent</th></tr></thead>
            <tbody>
            <tr th:each="row : ${rows}">
                <td th:text="${row.code}"></td>
                <td th:text="${row.name}"></td>
                <td th:text="${row.parentCode}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card bg-base-100 shadow-xl p-6">
        <h2 class="font-bold mb-1">Description</h2>
        <p class="text-xs opacity-60 mb-4">Markdown (headings, lists, links, tables). Shown via "About" on the time series and microdata explorer pages. Raw HTML is not rendered.</p>
        <div class="grid lg:grid-cols-2 gap-6">
            <form method="post" th:action="@{/structures/category-schemes/{id}/description(id=${scheme.id})}" class="space-y-2">
                <textarea class="textarea textarea-bordered w-full font-mono text-sm" rows="16" name="description"
                          placeholder="# About this scheme&#10;&#10;Scope, sources, contacts, links ..."
                          th:text="${scheme.description}"></textarea>
                <button class="btn btn-primary btn-sm" type="submit">Save description</button>
            </form>
            <div>
                <p class="text-xs font-semibold opacity-60 mb-2">Saved version</p>
                <div class="markdown-body" th:if="${!#strings.isEmpty(descriptionHtml)}" th:utext="${descriptionHtml}"></div>
                <p class="opacity-60 text-sm" th:if="${#strings.isEmpty(descriptionHtml)}">No description yet.</p>
            </div>
        </div>
    </div>

    <div class="card bg-base-100 shadow-xl p-6 max-w-lg">
        <h2 class="font-bold mb-4">Add category</h2>
        <form method="post" th:action="@{/structures/category-schemes/{id}/categories(id=${scheme.id})}" class="space-y-2">
            <select class="select select-bordered w-full" name="parentCategoryId">
                <option value="">(no parent - root node)</option>
                <option th:each="c : ${scheme.categories}" th:value="${c.id}" th:text="${c.code} + ' - ' + ${c.name}"></option>
            </select>
            <input class="input input-bordered w-full" name="code" placeholder="Code" required/>
            <input class="input input-bordered w-full" name="name" placeholder="Name" required/>
            <button class="btn btn-primary" type="submit">Add</button>
        </form>
    </div>
</div>
</body>
</html>
