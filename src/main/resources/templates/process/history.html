<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="sdmxdw">
<head th:replace="~{process/fragments/head :: head('History ' + ${file})}"></head>
<body class="min-h-screen bg-base-200">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="p-8 space-y-6">
    <div>
        <p class="text-sm"><a class="link" th:href="${backUrl}" th:text="${process != null} ? ${process.name} : 'Shared code'"></a></p>
        <h1 class="text-2xl font-bold">History of <span class="font-mono" th:text="${file}"></span></h1>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-[22rem_1fr] gap-4">
        <div class="card bg-base-100 shadow-xl p-4 h-fit">
            <ul class="menu menu-sm p-0">
                <li th:each="c : ${commits}">
                    <a th:href="@{''(file=${file},commit=${c.id})}" th:classappend="${c.id == selected} ? 'active'" class="flex-col items-start gap-0">
                        <span class="font-semibold" th:text="${#strings.abbreviate(c.message, 60)}"></span>
                        <span class="text-xs opacity-70" th:text="${c.shortId} + ' · ' + ${c.author} + ' · ' + ${#temporals.format(c.time, 'yyyy-MM-dd HH:mm')}"></span>
                    </a>
                </li>
            </ul>
            <p th:if="${#lists.isEmpty(commits)}" class="opacity-60 text-sm">No commits for this file yet.</p>
        </div>
        <div class="card bg-base-100 shadow-xl p-4 min-w-0">
            <pre th:if="${diff}" class="text-xs overflow-auto"><code><th:block th:each="line : ${diff.split('\n')}"><span
                th:classappend="${line.startsWith('+') and !line.startsWith('+++')} ? 'bg-success/20' : (${line.startsWith('-') and !line.startsWith('---')} ? 'bg-error/20' : (${line.startsWith('@@')} ? 'text-info' : ''))"
                th:text="${line}"></span>
</th:block></code></pre>
        </div>
    </div>
</div>
</body>
</html>
