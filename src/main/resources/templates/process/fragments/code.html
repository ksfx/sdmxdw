<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Code editor: file tree + CodeMirror. Parameters:
  base   - page URL of the folder ("/processes/5?tab=code" or "/processes/shared?x=1")
  action - URL prefix of the file actions ("/processes/5/files" or "/processes/shared/files")
-->
<div th:fragment="editor(base, action)" class="grid grid-cols-1 lg:grid-cols-[16rem_1fr] gap-4">
    <div class="card bg-base-100 shadow-xl p-4 h-fit">
        <h3 class="font-semibold text-sm mb-2" th:text="${folder} + '/'"></h3>
        <ul class="menu menu-xs p-0">
            <li th:each="f : ${files}">
                <a th:href="${base} + '&file=' + ${#uris.escapeQueryParam(f.path)}"
                   th:classappend="${file != null and file.path == f.path} ? 'active'">
                    <span class="badge badge-xs w-8"
                          th:classappend="${f.language == 'python'} ? 'badge-primary' : (${f.language == 'r'} ? 'badge-secondary' : 'badge-ghost')"
                          th:text="${f.language == 'python'} ? 'py' : (${f.language == 'r'} ? 'R' : (${f.language == 'text'} ? '·' : ${f.language}))"></span>
                    <span class="font-mono truncate" th:text="${f.path}"></span>
                </a>
            </li>
        </ul>
        <p th:if="${#lists.isEmpty(files)}" class="text-xs opacity-60">No files yet.</p>
        <form method="post" th:action="${action} + '/new'" class="mt-3 flex gap-1">
            <input class="input input-bordered input-xs flex-1 font-mono" name="path" placeholder="lib/helpers.py" required/>
            <button class="btn btn-xs" type="submit" title="New file (.py, .R, .sql, .yaml, .json, .csv, .md, ...)">+</button>
        </form>
        <p class="text-xs opacity-60 mt-2">Sub-folders are created automatically. Python modules in the folder are importable, R files can be loaded with <code>sdmxdw_source("lib.R")</code>.</p>
    </div>

    <div class="card bg-base-100 shadow-xl p-4 min-w-0">
        <div th:if="${file == null}" class="opacity-60">Select or create a file.</div>
        <div th:if="${binary == true}" class="opacity-60" th:text="${file.path} + ' (' + ${file.size} + ' bytes) cannot be edited in the browser.'"></div>
        <form th:if="${file != null and binary != true}" id="code-form" method="post" th:action="${action}" class="space-y-2">
            <div class="flex flex-wrap items-center gap-2">
                <span class="font-mono font-semibold" th:text="${file.path}"></span>
                <span class="badge badge-sm" th:text="${file.language}"></span>
                <span id="dirty" class="badge badge-sm badge-warning hidden">unsaved</span>
                <span class="flex-1"></span>
                <input class="input input-bordered input-sm w-72" name="message" placeholder="Change description (commit message)"/>
                <button class="btn btn-primary btn-sm" type="submit" title="Ctrl/Cmd+S">Save</button>
            </div>
            <input type="hidden" name="path" th:value="${file.path}"/>
            <textarea id="code" name="content" class="textarea textarea-bordered w-full font-mono text-sm" rows="30"
                      th:attr="data-language=${file.language}" th:text="${content}"></textarea>
        </form>
        <div th:if="${file != null}" class="flex flex-wrap gap-2 mt-3 text-sm">
            <a th:if="${gitLinked}" class="btn btn-xs" th:href="${action.replace('/files', '/history')} + '?file=' + ${#uris.escapeQueryParam(file.path)}">History</a>
            <form method="post" th:action="${action} + '/rename'" class="flex gap-1" th:if="${action != '/processes/shared/files'}">
                <input type="hidden" name="path" th:value="${file.path}"/>
                <input class="input input-bordered input-xs font-mono w-56" name="newPath" th:value="${file.path}" required/>
                <button class="btn btn-xs" type="submit">Rename</button>
            </form>
            <form method="post" th:action="${action} + '/delete'" onsubmit="return confirm('Delete this file?')">
                <input type="hidden" name="path" th:value="${file.path}"/>
                <button class="btn btn-xs btn-error btn-outline" type="submit">Delete</button>
            </form>
        </div>
    </div>
    <script src="/js/vendor/codemirror.js"></script>
    <script>
        (function () {
            const textarea = document.getElementById('code');
            if (!textarea || !window.SdmxdwEditor) return;
            const form = document.getElementById('code-form');
            const original = textarea.value;
            let dirty = false;
            window.SdmxdwEditor.attach(textarea, textarea.dataset.language, () => form.requestSubmit());
            textarea.addEventListener('input', () => {
                dirty = textarea.value !== original;
                document.getElementById('dirty').classList.toggle('hidden', !dirty);
            });
            form.addEventListener('submit', () => { dirty = false; });
            window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
        })();
    </script>
</div>
</body>
</html>
