<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="sdmxdw">
<head>
    <meta charset="UTF-8"/>
    <title>Change password</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/css/brand.css" />
    <link rel="icon" href="/img/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center">
<div class="card bg-base-100 shadow-xl p-6 max-w-lg w-full">
    <h1 class="text-xl font-bold mb-4">Change password</h1>
    <p class="mb-4 text-sm opacity-70">You must change your password on first login before you can continue.</p>
    <p class="text-error mb-2" th:if="${error}" th:text="${error}"></p>
    <form method="post" th:action="@{/account/change-password}" class="space-y-2">
        <input class="input input-bordered w-full" type="password" name="newPassword" placeholder="New password" required/>
        <input class="input input-bordered w-full" type="password" name="confirmPassword" placeholder="Confirm new password" required/>
        <button class="btn btn-primary w-full" type="submit">Change password</button>
    </form>
    <form method="post" th:action="@{/logout}" class="mt-2">
        <button class="btn btn-sm w-full" type="submit">Log out</button>
    </form>
</div>
</body>
</html>
