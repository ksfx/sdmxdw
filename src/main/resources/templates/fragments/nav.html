<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav" class="navbar bg-base-100 shadow mb-6 px-4 gap-4">
    <div class="flex-1 items-center gap-3">
        <a class="btn btn-ghost text-lg gap-2" th:href="@{/}">
            <img src="/img/logo-icon.png" alt="SDMxDW" class="navbar-logo"/>
            <span>SDMxDW</span>
        </a>
        <a class="btn btn-primary" th:href="@{/explore}">Explore time series</a>
        <a class="btn btn-primary" th:href="@{/explore/microdata}">Explore microdata</a>
    </div>
    <div class="flex-none items-center gap-2">
        <div class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="btn btn-sm btn-ghost">Structures ▾</div>
            <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-10 w-56 p-2 shadow">
                <li><a th:href="@{/structures/concept-schemes}">Concept Schemes</a></li>
                <li><a th:href="@{/structures/codelists}">Codelists</a></li>
                <li><a th:href="@{/structures/dsds}">DSDs</a></li>
                <li><a th:href="@{/structures/category-schemes}">Category Schemes</a></li>
                <li><a th:href="@{/structures/dataflows}">Dataflows</a></li>
                <li><a th:href="@{/microdata}">Manage microdata</a></li>
            </ul>
        </div>
        <a class="btn btn-sm btn-ghost" sec:authorize="hasRole('DATENMANAGER')" th:href="@{/processes}">Processes</a>
        <a class="btn btn-sm btn-ghost" sec:authorize="hasRole('DATENMANAGER')" th:href="@{/users}">Users</a>
        <a class="btn btn-sm btn-ghost" th:href="@{/api-docs}">API</a>
        <div class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar placeholder" title="Profile">
                <div class="bg-primary text-primary-content rounded-full w-9">
                    <span class="text-sm" th:text="${#authentication.principal.initials()}"></span>
                </div>
            </div>
            <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-10 w-60 p-2 shadow">
                <li class="menu-title">
                    <span th:text="${#authentication.principal.fullName()}"></span>
                    <span class="text-xs font-normal opacity-70" th:text="${#authentication.name}"></span>
                </li>
                <li><a th:href="@{/account/profile}">Profile</a></li>
                <li><a th:href="@{/account/profile#api-tokens}">API tokens</a></li>
                <li><button type="submit" form="logout-form">Log out</button></li>
            </ul>
            <form id="logout-form" method="post" th:action="@{/logout}" class="hidden"></form>
        </div>
    </div>
</nav>
</body>
</html>
