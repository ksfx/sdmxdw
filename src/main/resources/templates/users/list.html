<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="sdmxdw">
<head>
    <meta charset="UTF-8"/>
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/css/brand.css" />
    <link rel="icon" href="/img/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="p-8 space-y-6">
    <div class="card bg-base-100 shadow-xl p-6">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold">Users</h1>
            <a class="btn btn-primary btn-sm" th:href="@{/users/new}">New user</a>
        </div>
        <table class="table">
            <thead>
            <tr><th>Name</th><th>Email</th><th>Role</th><th>Password change pending</th></tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.firstName} + ' ' + ${user.lastName}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.role}"></td>
                <td th:text="${user.mustChangePassword} ? 'yes' : 'no'"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
