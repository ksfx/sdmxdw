<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="sdmxdw">
<head>
    <meta charset="UTF-8"/>
    <title>History</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/css/brand.css" />
    <link rel="icon" href="/img/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="p-8">
    <div class="card bg-base-100 shadow-xl p-6">
        <h1 class="text-xl font-bold mb-1">Vintage history</h1>
        <p class="text-sm opacity-70 mb-4">
            <span class="font-mono" th:text="${seriesKey}"></span> @ <span th:text="${timePeriod}"></span>
            – <span class="badge badge-sm" th:classappend="${stage.name() == 'ALPHA'} ? 'badge-warning'" th:text="${stage.name() == 'ALPHA'} ? 'Unpublished (Alpha)' : 'Published (Beta)'"></span>
        </p>
        <table class="table">
            <thead><tr><th>Values</th><th>Valid from</th><th>Valid to</th><th>Recorded by</th><th>Reason</th></tr></thead>
            <tbody>
            <tr th:each="row : ${rows}">
                <td th:text="${row.measuresLabel}"></td>
                <td th:text="${row.validFrom}"></td>
                <td th:text="${row.validTo}"></td>
                <td th:text="${row.recordedBy}"></td>
                <td th:text="${row.comment} ?: ''"></td>
            </tr>
            </tbody>
        </table>
        <a class="btn btn-sm mt-4 w-fit" th:href="@{/explore/dataflows/{id}(id=${dataflow.id},view='observations',stage=${stage})}">Back</a>
    </div>
</div>
</body>
</html>
