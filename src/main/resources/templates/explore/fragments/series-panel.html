<div xmlns:th="http://www.thymeleaf.org">
    <h2 class="text-xl font-bold font-mono" th:text="${seriesKey}"></h2>
    <div th:replace="~{explore/fragments/series-parts :: meta}"></div>
    <div class="mt-3 flex gap-2">
        <div th:replace="~{explore/fragments/series-parts :: exportMenu}"></div>
        <a class="btn btn-sm" th:href="@{/explore/dataflows/{id}/series/{sid}(id=${dataflow.id},sid=${seriesId},asOf=${asOf},stage=${stage == 'ALPHA'} ? 'ALPHA' : null)}">Open full page</a>
    </div>
    <div class="mt-3"><form th:replace="~{explore/fragments/series-parts :: asOfForm}"></form></div>
    <div class="mt-3"><div th:replace="~{explore/fragments/series-parts :: stageSwitch}"></div></div>
    <canvas id="seriesChart" class="mt-4" height="100"></canvas>
    <table th:replace="~{explore/fragments/series-parts :: valueTable}"></table>
</div>
<script th:inline="javascript">
    (function () {
        const labels = /*[[${chartLabels}]]*/ [];
        const values = /*[[${chartValues}]]*/ [];
        const keyLabel = /*[[${seriesKey}]]*/ 'Series';
        const asOfValues = /*[[${chartAsOfValues}]]*/ null;
        const canvas = document.getElementById('seriesChart');
        if (canvas && window.Chart) {
            new Chart(canvas, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{label: keyLabel, data: values, borderColor: '#053771', tension: 0.1}].concat(
                        asOfValues ? [{label: 'as of ' + /*[[${asOf}]]*/ '', data: asOfValues, borderColor: '#13ad8f', borderDash: [6, 4], tension: 0.1}] : [])
                }
            });
        }
    })();
</script>
