<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="sdmxdw">
<head>
    <meta charset="UTF-8"/>
    <title>Explore microdata</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/css/brand.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body class="min-h-screen bg-base-200">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="p-8 space-y-6">
    <form method="get" class="flex items-center gap-2">
        <label class="text-sm font-semibold" for="reportingPeriodSelect">Reference date / reporting period</label>
        <select id="reportingPeriodSelect" class="select select-bordered select-sm" name="reportingPeriod" onchange="this.form.submit()">
            <option value="" th:selected="${reportingPeriod == null or #strings.isEmpty(reportingPeriod)}">All periods</option>
            <option th:each="p : ${reportingPeriods}" th:value="${p}" th:text="${p}" th:selected="${p == reportingPeriod}"></option>
        </select>
    </form>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="card bg-base-100 shadow-xl p-6 overflow-auto" style="max-height: 80vh;">
            <div th:each="tree : ${trees}" class="mb-6">
                <div class="flex items-center justify-between gap-2 mb-4">
                    <h1 class="text-xl font-bold"><a class="link link-hover" title="Open the category scheme: flows, relations, description"
                        th:href="@{/explore/microdata/category-schemes/{id}(id=${tree.id})}" th:text="${tree.artefactId} + ' - ' + ${tree.name}"></a></h1>
                    <div class="flex gap-2 shrink-0">
                    <button type="button" class="btn btn-sm btn-ghost border-base-300" th:if="${tree.hasDescription}"
                            th:attr="hx-get=@{/explore/category-schemes/{id}/about(id=${tree.id})}"
                            hx-target="#detail-panel" hx-swap="innerHTML">About</button>
                    <button type="button" class="btn btn-sm btn-secondary"
                            th:attr="data-scheme-id=${tree.id}"
                            onclick="openRelations(this.dataset.schemeId)">Show relations</button>
                    </div>
                </div>
                <div th:replace="~{::nodeList(${tree.roots})}"></div>
            </div>

            <div th:if="${not #lists.isEmpty(uncategorizedFlows)}" class="mt-6">
                <h2 class="font-bold mb-2 opacity-70">Uncategorized</h2>
                <ul class="space-y-1">
                    <li th:each="flow : ${uncategorizedFlows}">
                        <details th:attr="hx-get=@{/explore/microdata/{id}/records-fragment(id=${flow.id},reportingPeriod=${reportingPeriod})},hx-trigger='toggle once',hx-target='find .records-slot',hx-swap='innerHTML'">
                            <summary class="cursor-pointer">
                                <span class="font-mono text-sm" th:text="${flow.agencyId} + ':' + ${flow.artefactId}"></span>
                                <span class="opacity-70" th:text="'- ' + ${flow.name}"></span>
                                <a class="link link-primary text-xs ml-2" title="Open the flow page: all records, filters, export"
                                   th:href="@{/explore/microdata/{id}(id=${flow.id},reportingPeriod=${reportingPeriod})}" onclick="event.stopPropagation()">open ›</a>
                            </summary>
                            <div class="records-slot pl-4 mt-1">
                                <span class="loading loading-spinner loading-xs"></span>
                            </div>
                        </details>
                    </li>
                </ul>
            </div>
        </div>

        <div class="card bg-base-100 shadow-xl p-6 overflow-auto" style="max-height: 80vh;" id="detail-panel">
            <p class="opacity-60">
                Expand a category and a flow on the left and select a record. Reference fields in the
                record are clickable and load the linked record directly here.
            </p>
        </div>
    </div>

    <ul th:fragment="nodeList(nodes)" class="pl-4">
        <li th:each="node : ${nodes}">
            <details th:attr="hx-get=${node.flowCount > 0} ? @{/explore/microdata/categories/{id}/flows-fragment(id=${node.id},reportingPeriod=${reportingPeriod})} : null,hx-trigger=${node.flowCount > 0} ? 'toggle once' : null,hx-target=${node.flowCount > 0} ? 'find .flow-slot' : null,hx-swap='innerHTML'">
                <summary class="cursor-pointer">
                    <span th:text="${node.code} + ' - ' + ${node.name}"></span>
                    <span class="text-xs opacity-60 ml-2" th:if="${node.flowCount > 0}" th:text="'(' + ${node.flowCount} + ' Flow(s))'"></span>
                </summary>
                <div class="flow-slot pl-4 mt-1" th:if="${node.flowCount > 0}">
                    <span class="loading loading-spinner loading-xs"></span>
                </div>
                <div th:if="${not #lists.isEmpty(node.children)}" th:replace="~{::nodeList(${node.children})}"></div>
            </details>
        </li>
    </ul>
</div>
<div th:replace="~{explore/fragments/relations :: view(false)}"></div>
<script src="/js/relations.js"></script>
</body>
</html>
