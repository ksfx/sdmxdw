<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="sdmxdw">
<head>
    <meta charset="UTF-8"/>
    <title>Search results</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="/css/brand.css" />
    <link rel="icon" href="/img/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="p-8">
    <div class="card bg-base-100 shadow-xl p-6">
        <h1 class="text-xl font-bold mb-4" th:text="'Search results for ' + ${query}"></h1>
        <form method="get" th:action="@{/explore}" class="flex gap-2 mb-4">
            <input class="input input-bordered flex-1" type="text" name="q" th:value="${query}"/>
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
        <table class="table">
            <thead><tr><th>Dataflow</th><th>Name</th></tr></thead>
            <tbody>
            <tr th:each="df : ${matchingDataflows}">
                <td><a class="link link-primary" th:href="@{/explore/dataflows/{id}(id=${df.id})}" th:text="${df.artefactId}"></a></td>
                <td th:text="${df.name}"></td>
            </tr>
            </tbody>
        </table>
        <a class="btn btn-sm mt-4" th:href="@{/explore}">Back to tree</a>
    </div>
</div>
</body>
</html>
