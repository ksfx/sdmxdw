spring.application.name=sdmxdw

# Database: set SDMXDW_DB_URL / SDMXDW_DB_USER / SDMXDW_DB_PASSWORD (see ops/sdmxdw.env.example)
spring.datasource.url=${SDMXDW_DB_URL:jdbc:postgresql://localhost:5432/sdmxdw}
spring.datasource.username=${SDMXDW_DB_USER:sdmxdw}
spring.datasource.password=${SDMXDW_DB_PASSWORD:}

spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=DATENMANAGER
management.info.env.enabled=true
# Failure notifications already degrade gracefully if the SMTP relay is unreachable
# (logged and skipped, see ProcessNotificationService) - it shouldn't
# also flip the whole app's health status to DOWN.
management.health.mail.enabled=false

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

# Initial password of admin@sdmxdw.local on an empty database (random and logged if not set)
sdmxdw.bootstrap.admin-password=${SDMXDW_ADMIN_PASSWORD:}
# fictional demo data (agency DEMO), created once on start
sdmxdw.demo-data.enabled=${SDMXDW_DEMO_DATA:false}

sdmxdw.plugins.python-executable=${SDMXDW_PYTHON:python3}
sdmxdw.plugins.scripts-dir=${SDMXDW_SCRIPTS_DIR:}

# Processes (#20): code in the process folder (later a Git working copy), runs and the secret key
# in the data folder. The legacy plugin folder is only read once by LegacyImportMigration.
sdmxdw.processes.dir=${SDMXDW_PROCESSES_DIR:processes}
sdmxdw.processes.runs-dir=${SDMXDW_RUNS_DIR:data/runs}
sdmxdw.processes.secret-key-file=${SDMXDW_SECRET_KEY_FILE:data/secret.key}
sdmxdw.processes.git-dir=${SDMXDW_GIT_DIR:data/git}
sdmxdw.processes.python-executable=${sdmxdw.plugins.python-executable}
sdmxdw.processes.r-executable=${SDMXDW_RSCRIPT:Rscript}
sdmxdw.processes.r-libs=${SDMXDW_R_LIBS:}
sdmxdw.processes.api-url=http://localhost:${local.server.port:${server.port:8080}}/rest
sdmxdw.processes.max-parallel-runs=2

spring.mail.host=${SDMXDW_SMTP_HOST:localhost}
spring.mail.port=${SDMXDW_SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# SDMX 3.0 REST filters use brackets in query parameter names (c[TIME_PERIOD]=ge:2020-Q1),
# which browsers and many clients send unencoded
server.tomcat.relaxed-query-chars=[,]
